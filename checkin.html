<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Check-in · Dink Happens 1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08123A;--panel:#0E1D57;--field:#0A1648;--line:#2A3E9A;--volt:#DDFF1A;--ink:#0A1240;--text:#F4F7FF;--muted:#A9B6E6;
  --ok:#2FD36B;--bad:#FF5C5C;--warn:#FFC21A;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 60px}
h1{margin:0 0 4px;font-family:var(--display);font-style:italic;font-weight:900;font-size:36px;line-height:1;text-transform:uppercase}
h1 span{background:var(--volt);color:var(--ink);padding:0 .3em}
.sub{margin:8px 0 18px;color:var(--muted)}
input{width:100%;padding:15px 14px;font:inherit;font-size:18px;color:var(--text);background:var(--field);border:2px solid var(--line);border-radius:10px;min-height:54px}
input:focus{outline:3px solid var(--volt);outline-offset:1px;border-color:var(--volt)}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:10px;background:var(--volt);color:var(--ink);font-weight:700;font-size:18px;min-height:54px}
.btn:disabled{opacity:.6}
.stats{display:flex;gap:10px;margin:0 0 14px}
.stats div{flex:1;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-style:italic;font-size:30px;line-height:1;color:var(--volt)}
.msg{margin:12px 0;padding:12px 14px;border-radius:10px;border:2px solid var(--bad);background:rgba(255,92,92,.12);color:#FFD3D3;font-weight:600;display:none}
.res{margin-top:16px;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--panel)}
.banner{padding:14px 16px;font-family:var(--display);font-style:italic;font-weight:900;font-size:28px;line-height:1.05;text-transform:uppercase;color:#062012;background:var(--ok)}
.banner small{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:14px;text-transform:none;margin-top:4px}
.banner.no{background:var(--bad);color:#2B0505}
.banner.wait{background:var(--warn);color:#2E2000}
.rid{padding:12px 16px 0;font-family:var(--display);font-style:italic;font-weight:900;font-size:34px;color:var(--volt)}
dl{margin:0;padding:6px 16px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--muted);font-size:15px}dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
.flag{margin:0 16px 12px;padding:8px 10px;border-radius:8px;background:rgba(255,194,26,.14);color:#FFE7A8;font-size:14px}
.act{padding:0 16px 16px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Check-in</span></h1>
  <p class="sub">Organizers only</p>

  <section id="lock">
    <label for="pin" style="font-weight:600">Organizer PIN</label>
    <input id="pin" type="password" autocomplete="off" placeholder="Enter PIN">
    <button class="btn" id="unlock">Unlock</button>
    <div class="msg" id="lockErr" role="alert"></div>
  </section>

  <section id="app" class="hidden">
    <div class="stats"><div><b id="sConf">–</b>Confirmed</div><div><b id="sIn">–</b>Checked in</div><div><b id="sTot">–</b>Registered</div></div>
    <form id="sf">
      <label for="q" style="font-weight:600">Team ID, player name, email, mobile or payment ref</label>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" placeholder="PB-2026-00125">
      <button class="btn" type="submit" id="go">Search</button>
    </form>
    <div class="msg" id="err" role="alert"></div>
    <div id="out"></div>
  </section>
</div>

<script>
  window.DINK_EXEC_URL = "https://script.google.com/macros/s/AKfycbyuO-uGMzaRbgKOT1_s-4Mi_qMZiMA5pQop5Dm9sFqfU5dHsrH0dqRiXCfkWYiRHxwL/exec"; // same exec URL as index.html; this page is organizer-only, so keep its link unlisted
</script>
<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var EXTERNAL_EXEC_URL = window.DINK_EXEC_URL && String(window.DINK_EXEC_URL).trim();
  /** See the matching comment in Index.html: google.script.run is used when this page is
   *  hosted by Apps Script itself, since location.href inside Apps Script's sandbox iframe
   *  is not the real /exec URL. fetch() is used only for an externally hosted copy, where
   *  window.DINK_EXEC_URL is a real, known address. */
  function callServer(fn, args){
    args = args || [];
    if (EXTERNAL_EXEC_URL) {
      return fetch(EXTERNAL_EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args })
      }).then(function(r){
        if(!r.ok) throw new Error('Server returned ' + r.status);
        return r.json();
      }).then(function(data){
        if(data && data.__error) throw new Error(data.__error);
        return data;
      });
    }
    return new Promise(function(resolve, reject){
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function(e){ reject(e instanceof Error ? e : new Error((e && e.message) || String(e))); });
      runner[fn].apply(runner, args); // must call bound to `runner`, not detached, or google.script.run breaks
    });
  }
  var PIN='';
  var peso=function(n){return '\u20B1'+String(Number(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');};
  var el=function(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;};

  function unlock(){
    var b=$('#unlock'); b.disabled=true; b.textContent='Checking…'; $('#lockErr').style.display='none';
    var p=$('#pin').value;
    callServer('checkinAuth',[p]).then(function(st){
      PIN=p; $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden'); stats(st); $('#q').focus();
    }).catch(function(e){
      b.disabled=false; b.textContent='Unlock'; var m=$('#lockErr'); m.textContent=(e&&e.message||'Error').replace(/^Error:\s*/,''); m.style.display='block';
    });
  }
  $('#unlock').addEventListener('click',unlock);
  $('#pin').addEventListener('keydown',function(e){ if(e.key==='Enter') unlock(); });

  function stats(s){ if(!s) return; $('#sConf').textContent=s.confirmed; $('#sIn').textContent=s.checkedIn; $('#sTot').textContent=s.total; }
  function err(m){ var e=$('#err'); e.textContent=m; e.style.display=m?'block':'none'; }

  $('#sf').addEventListener('submit',function(ev){
    ev.preventDefault(); err(''); var q=$('#q').value.trim(); if(q.length<2){ err('Type at least 2 characters.'); return; }
    var b=$('#go'); b.disabled=true; b.textContent='Searching…';
    callServer('checkinSearch',[PIN,q]).then(function(list){
      b.disabled=false; b.textContent='Search'; render(list);
    }).catch(function(e){
      b.disabled=false; b.textContent='Search'; err((e&&e.message||'Error').replace(/^Error:\s*/,''));
    });
  });

  function render(list){
    var out=$('#out'); out.textContent='';
    if(!list.length){ err('No match. Check the spelling or try the email or payment reference.'); return; }
    list.forEach(function(c){ out.appendChild(card(c)); });
    if(list.length===1) $('#q').select();
  }

  function card(c){
    var box=el('div','res');
    var cls='banner', head, sub='';
    if(c.checkedIn){ cls+=' wait'; head='Already checked in'; sub='Checked in at '+c.checkedAt; }
    else if(c.canCheckIn){ head='Cleared to play'; sub='Payment verified · Team confirmed'; }
    else { cls+=' no'; head='Not cleared'; sub=c.reason; }
    var b=el('div',cls,head); b.appendChild(el('small','',sub)); box.appendChild(b);
    box.appendChild(el('div','rid',c.id));
    var dl=el('dl');
    [['Player 1',c.p1],['Player 2',c.p2],['Category',c.category],['Subcategory',c.subcategory],['Total fee',peso(c.fee)],['Payment ref',c.payRef||'–'],['Payment status',c.payStatus],['Registration',c.regStatus]].forEach(function(r){
      dl.appendChild(el('dt','',r[0])); dl.appendChild(el('dd','',r[1]));
    });
    box.appendChild(dl);
    if(c.flags) box.appendChild(el('div','flag','Auto-check: '+c.flags));
    if(c.canCheckIn){
      var a=el('div','act'), btn=el('button','btn','Check in team');
      btn.addEventListener('click',function(){
        btn.disabled=true; btn.textContent='Saving…';
        callServer('checkinMark',[PIN,c.id]).then(function(r){
          if(r&&r.ok){ stats(r.stats); box.replaceWith(card(r.card)); }
          else { btn.disabled=false; btn.textContent='Check in'; err((r&&r.error)||'Could not check in.'); }
        }).catch(function(e){ btn.disabled=false; btn.textContent='Check in'; err((e&&e.message||'Error').replace(/^Error:\s*/,'')); });
      });
      a.appendChild(btn); box.appendChild(a);
    }
    return box;
  }
})();
</script>
</body>
</html>
